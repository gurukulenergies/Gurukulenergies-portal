services:
  - type: web
    name: gurukul-tenant-portal
    runtime: node
    plan: starter            # persistent disks need a paid plan
    buildCommand: "echo no build"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_KEY
        generateValue: true  # Render creates a random key; copy it from the dashboard
      - key: DATA_DIR
        value: /var/data
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
    disk:
      name: portal-data
      mountPath: /var/data
      sizeGB: 1
